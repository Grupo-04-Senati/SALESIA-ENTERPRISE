<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Tema por defecto: claro. Solo aplica oscuro si el usuario lo guardó.
      try {
        var t = localStorage.getItem('salesia-theme')
        if (t !== 'light' && t !== 'dark') {
          t = 'light'
          localStorage.setItem('salesia-theme', t)
        }
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SalesIA Enterprise — Sistema web empresarial de gestión de ventas y analítica estadística."
    />
    <title>SalesIA Enterprise — Sistema de Gestión y Analítica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
